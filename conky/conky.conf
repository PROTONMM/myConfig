conky.text = [[
${voffset 410}
${color1}${font Monaspace Krypton Frozen:style=Bold:size=14}POGODA ${hr 2}${font}
${color}Miasto:${alignr}Urle
${color}Pogoda:${alignr}${execi 1800 curl -fsSL --max-time 10 'https://wttr.in/Urle?format=%t+%C'}
${color}Odczuwalna:${alignr}${execi 1800 curl -fsSL --max-time 10 'https://wttr.in/Urle?format=%f'}
${color}Wiatr / Wilgotnosc:${alignr}${execi 1800 curl -s "wttr.in/Urle?format=j1" | jq -r '.current_condition[0] | "\(.winddir16Point) \(.windspeedKmph)km/h \(.humidity)%"'}
${color}Jutro min / max:${alignr}${execi 1800 curl -fsSL --max-time 10 'https://wttr.in/Urle?format=j1' | jq -r '.weather[1] | "\(.mintempC)°C / \(.maxtempC)°C"'}
${color}Jutro pogoda:${alignr}${execi 1800 curl -fsSL --max-time 10 'https://wttr.in/Urle?format=j1' | jq -r '.weather[1].hourly[4].weatherDesc[0].value'}

${color1}${font Monaspace Krypton Frozen:style=Bold:size=14}SYSTEM ${hr 1}${font}
${color}Czas pracy:${alignr}$uptime
${color}RAM:${alignr}$mem / $memmax
${color}Procesy:${alignr}$processes ($running_processes uruchomione)

${color1}${font Monaspace Krypton Frozen:style=Bold:size=14}SIEC ${hr 1}${font}
${color}IP Lokalne:${alignr}${addr enp2s0}
${color}Pobieranie:${alignr}${downspeed enp2s0}
${downspeedgraph enp2s0 25,340 00FF88 007744}
${color}Wysylanie:${alignr}${upspeed enp2s0}
${upspeedgraph enp2s0 25,340 FF8800 884400}
]]


